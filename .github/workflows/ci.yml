name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: neobank
          POSTGRES_PASSWORD: neobank_dev
          POSTGRES_DB: neobank
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neobank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://neobank:neobank_dev@localhost:5432/neobank
      JWT_ACCESS_SECRET: ci-only-access-secret
      JWT_REFRESH_SECRET: ci-only-refresh-secret
      WEB_ORIGINS: http://localhost:4200
      API_URL: http://localhost:3000/api
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Nothing else typechecks prisma/ — it belongs to no Nx project, and tsx
      # strips types without checking them. Runs before the database work
      # because it needs nothing but the generated client.
      - run: pnpm typecheck:prisma
      - run: pnpm prisma migrate deploy
      # Seed and check ground truth BEFORE anything else touches the database.
      # The e2e suites work on their own @e2e.neobank.test users and leave the
      # seeded accounts alone, but ordering it this way means that stops being
      # something to rely on. If a future test does write to a seeded account,
      # this has already run, and reordering these steps produces the
      # precondition's own message rather than a puzzle.
      - name: Seed the eval fixture
        run: pnpm db:seed:eval
      - name: Tool ground truth
        run: pnpm nx run api:ground-truth
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm nx e2e api-e2e
      - name: Lint, typecheck, test, and build
        run: pnpm exec nx run-many -t lint typecheck test build
      - name: Start API
        run: |
          pnpm nx serve api &
          npx wait-on http://localhost:3000/api/health --timeout 60000
      - run: pnpm nx e2e web-e2e
